name: Bug report
description: Report incorrect discovery, execution, or dashboard behavior
title: ""
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: DevDash/Python versions, operating system, relevant project tools, and install method.
  - type: textarea
    attributes:
      label: Diagnostics
      description: Optional `devdash --doctor --debug` output. Inspect paths, arguments and logs for private information before sharing. Never include secrets or .env contents.
