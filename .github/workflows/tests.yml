name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.11'
            textual: '0.80.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - if: matrix.textual
        run: python -m pip install 'textual==${{ matrix.textual }}'
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - run: python -m build
      - run: python scripts/smoke_wheel.py dist/*.whl
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: rustup default stable
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -p test_integration.py -v
        env:
          CALLTRAIL_LIVE_DOCKER: '1'
