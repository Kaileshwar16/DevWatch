[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "devdash"
version = "0.3.0"
description = "A terminal dashboard for local projects, environment diagnostics, and explainable checks"
authors = [{name = "DevDash contributors"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "dashboard", "developer-tools", "terminal", "tasks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development",
]
dependencies = [
    "textual>=0.80.0,<9",
    "psutil>=5.9.0,<8",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/Kaileshwar16/DevWatch"
Issues = "https://github.com/Kaileshwar16/DevWatch/issues"
Changelog = "https://github.com/Kaileshwar16/DevWatch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff>=0.6,<1", "build>=1.2,<2", "pytest>=8,<10"]

[project.scripts]
devdash = "devdash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["devdash"]

[tool.hatch.build.targets.sdist]
include = ["/devdash", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/examples", "/SECURITY.md", "/CONTRIBUTING.md", "/RELEASE_NOTES.md", "/scripts"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
